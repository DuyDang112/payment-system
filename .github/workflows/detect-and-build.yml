name: Build Changed Services

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:

  detect:

    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changed.outputs.services }}
      environment: ${{ steps.env.outputs.environment }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Determine Environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

      - name: Detect Changed Services
        id: changed
        run: |

          CHANGED=$(git diff --name-only HEAD~1 HEAD)

          SERVICES=()

          echo "$CHANGED" | grep '^src/ApiGateway/' && SERVICES+=("api-gateway") || true
          echo "$CHANGED" | grep '^src/Services/PaymentProcessing/' && SERVICES+=("payment-processing") || true
          echo "$CHANGED" | grep '^src/Services/PaymentRouter/' && SERVICES+=("payment-router") || true
          echo "$CHANGED" | grep '^src/Services/RiskAssessment/' && SERVICES+=("risk-assessment") || true
          echo "$CHANGED" | grep '^src/Services/BankAdapter/' && SERVICES+=("bank-adapter") || true

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No services changed"
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed services: ${SERVICES[@]}"

          JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)

          echo "services=$JSON" >> $GITHUB_OUTPUT

  build:

    needs: detect

    if: needs.detect.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}

    steps:

      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Dockerfile Path
        id: dockerfile
        run: |

          case "${{ matrix.service }}" in

            api-gateway)
              echo "path=src/ApiGateway/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=src/ApiGateway" >> $GITHUB_OUTPUT
              ;;

            payment-processing)
              echo "path=src/Services/PaymentProcessing/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=src/Services/PaymentProcessing" >> $GITHUB_OUTPUT
              ;;

            payment-router)
              echo "path=src/Services/PaymentRouter/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=src/Services/PaymentRouter" >> $GITHUB_OUTPUT
              ;;

            risk-assessment)
              echo "path=src/Services/RiskAssessment/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=src/Services/RiskAssessment" >> $GITHUB_OUTPUT
              ;;

            bank-adapter)
              echo "path=src/Services/BankAdapter/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=src/Services/BankAdapter" >> $GITHUB_OUTPUT
              ;;

            *)
              echo "Unknown service: ${{ matrix.service }}"
              exit 1
              ;;

          esac

      - name: Validate Dockerfile Exists
        run: |
          if [ ! -f "${{ steps.dockerfile.outputs.path }}" ]; then
            echo "Dockerfile not found at: ${{ steps.dockerfile.outputs.path }}"
            exit 1
          fi

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ needs.detect.outputs.tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  update-helm:

    needs:
      - detect
      - build

    uses: ./.github/workflows/update-helm.yml

    with:
      services: ${{ needs.detect.outputs.services }}
      environment: ${{ needs.detect.outputs.environment }}
      tag: ${{ needs.detect.outputs.tag }}

    secrets: inherit
