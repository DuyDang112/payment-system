auth:
  postgresPassword: "Postgres123!"
  username: "paymentuser"
  password: "Payment123!"
  # database: "paymentdb"

architecture: standalone

primary:
  persistence:
    enabled: true
    storageClass: nfs-storage
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP

metrics:
  enabled: true

  serviceMonitor:
    enabled: true
    namespace: monitoring

volumePermissions:
  enabled: true

networkPolicy:
  enabled: false

backup:
  enabled: false

fullnameOverride: postgresql