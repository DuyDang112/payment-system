replicaCount: 1
imagePullSecrets: []
service:
  type: ClusterIP
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Development"
  - name: ASPNETCORE_URLS
    value: "http://+:8080"
  - name: OpenTelemetry__OtlpEndpoint
    value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"

secretName: riskassessment-secret

# It's recommended to uncomment and adjust these for production deployments.
resources:
  {}
