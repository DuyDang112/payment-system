mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

    prometheus:
      endpoint: "0.0.0.0:8889"

    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions:
      - health_check

    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - otlp/tempo

      metrics:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - prometheus

      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki]

ports:
  otlp:
    enabled: true

  otlp-http:
    enabled: true

  metrics:
    enabled: true

serviceMonitor:
  enabled: true

presets:
  kubernetesAttributes:
    enabled: true