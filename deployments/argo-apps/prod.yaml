global:
  repoURL: "https://github.com/DuyDang112/payment-system.git"
  targetRevision: "main"
  destinationServer: "https://kubernetes.default.svc"
  project: "PaymentSystem-Prod"

applications:
  api-gateway:
    enabled: true
    destinationNamespace: payment-system-prod
    path: deployments/helm-charts/api-gateway
    valuesFile: deployments/argo-apps/values/prod/api-gateway.yaml

  payment-processing:
    enabled: true
    destinationNamespace: payment-system-prod
    path: deployments/helm-charts/payment-processing
    valuesFile: deployments/argo-apps/values/prod/payment-processing.yaml

  payment-router:
    enabled: true
    destinationNamespace: payment-system-prod
    path: deployments/helm-charts/payment-router
    valuesFile: deployments/argo-apps/values/prod/payment-router.yaml

  risk-assessment:
    enabled: true
    destinationNamespace: payment-system-prod
    path: deployments/helm-charts/risk-assessment
    valuesFile: deployments/argo-apps/values/prod/risk-assessment.yaml

  bank-adapter:
    enabled: true
    destinationNamespace: payment-system-prod
    path: deployments/helm-charts/bank-adapter
    valuesFile: deployments/argo-apps/values/prod/bank-adapter.yaml


